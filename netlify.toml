[build]
  publish = "."
  command = ""
  # Solo se publica si cambian los archivos de la propia web. Los cambios en datos, scripts o
  # workflows no gastan créditos, aunque el commit no lleve [skip netlify].
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html privacidad.html og-image.png '*.woff2' netlify.toml"

[[headers]]
  for = "/datos.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
