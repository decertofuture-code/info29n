[build]
  publish = "."
  command = ""
  # Solo se publica si cambian los archivos de la propia web (no los datos, scripts ni workflows).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html privacidad.html og-image.png '*.woff2' netlify.toml estatico.css partido tema comparador img sitemap.xml robots.txt"

[[headers]]
  for = "/datos.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Las páginas fijas y las imágenes se pueden guardar en caché un rato.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
