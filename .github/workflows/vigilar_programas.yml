name: Vigilar programas electorales

# Cada 3 horas busca en las webs oficiales de los partidos si han publicado su programa.
# Si encuentra alguno nuevo, extrae las medidas con Claude y abre UNA propuesta de cambio
# con todos los programas nuevos, para revisarla antes de publicar.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      programas:
        description: "Opcional: programas ya localizados, «partido url» separados por punto y coma (se procesan sin buscar)"
        type: string
        required: false
      partidos:
        description: "Opcional: buscar solo en estos partidos (ids separados por espacios)"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vigilar-programas
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lector de PDF
        run: pip install pypdf

      - name: Buscar programas nuevos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SOLO_PARTIDOS: ${{ inputs.partidos }}
          MANUAL: ${{ inputs.programas }}
        run: |
          if [ -n "$MANUAL" ]; then
            echo "$MANUAL" | tr ';' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' > encontrados.txt
          else
            python vigilar_programas.py
          fi
          echo "--- encontrados"; cat encontrados.txt

      - name: Extraer medidas de cada programa
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          : > informe_total.md; : > procesados.txt
          while read -r PARTIDO URL_PDF; do
            [ -z "$PARTIDO" ] && continue
            echo "=== $PARTIDO $URL_PDF"
            if PARTIDO="$PARTIDO" URL_PDF="$URL_PDF" python extraer_programa.py < /dev/null; then
              cat informe_programa.md >> informe_total.md; echo "" >> informe_total.md
              echo "$PARTIDO" >> procesados.txt
            else
              printf '## %s\n\n⚠️ No se pudo procesar %s. Revisar el registro del workflow.\n\n' "$PARTIDO" "$URL_PDF" >> informe_total.md
            fi
          done < encontrados.txt

      - name: Abrir propuesta de cambio para revisar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s procesados.txt ]; then echo "Nada nuevo que proponer."; exit 0; fi
          LISTA=$(paste -sd ' ' procesados.txt)
          RAMA="programas-$(echo $LISTA | tr ' ' '-')-$(date +%Y%m%d-%H%M)"
          git config user.name "info29n-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RAMA"
          git add datos.json
          git commit -m "Programas de $LISTA: borrador para revisar [skip netlify]"
          git push origin "$RAMA"
          gh pr create --base main --head "$RAMA" \
            --title "Programas electorales: $LISTA (revisar antes de publicar)" \
            --body-file informe_total.md
