name: Vigilar programas electorales

# Cada 3 horas busca en las webs oficiales de los partidos si han publicado su programa.
# Si encuentra alguno nuevo, extrae las medidas con Claude y abre UNA propuesta de cambio
# con todos los programas nuevos, para revisarla antes de publicar.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      programas:
        description: "Opcional: programas ya localizados, «partido url» separados por punto y coma (se procesan sin buscar)"
        type: string
        required: false
      partidos:
        description: "Opcional: buscar solo en estos partidos (ids separados por espacios)"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vigilar-programas
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lector de PDF
        run: pip install pypdf

      - name: Continuar el borrador abierto, si lo hay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si ya hay una propuesta de programas sin aprobar, se añade a ella para que no choquen en datos.json.
          RAMA=$(gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
                   --jq '[.[] | select(.head.ref | startswith("programas-"))][0].head.ref // ""')
          PR=$(gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
                   --jq '[.[] | select(.head.ref | startswith("programas-"))][0].number // ""')
          if [ -n "$RAMA" ]; then
            git fetch origin "$RAMA" && git checkout "$RAMA"
            echo "Se continúa el borrador #$PR ($RAMA)"
          fi
          echo "RAMA=$RAMA" >> "$GITHUB_ENV"; echo "PR=$PR" >> "$GITHUB_ENV"

      - name: Buscar programas nuevos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SOLO_PARTIDOS: ${{ inputs.partidos }}
          MANUAL: ${{ inputs.programas }}
        run: |
          if [ -n "$MANUAL" ]; then
            echo "$MANUAL" | tr ';' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' > encontrados.txt
          else
            python vigilar_programas.py
          fi
          echo "--- encontrados"; cat encontrados.txt

      - name: Extraer medidas de cada programa
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p informes; : > procesados.txt
          while read -r PARTIDO URL_PDF; do
            [ -z "$PARTIDO" ] && continue
            echo "=== $PARTIDO $URL_PDF"
            if PARTIDO="$PARTIDO" URL_PDF="$URL_PDF" python extraer_programa.py < /dev/null; then
              cp informe_programa.md "informes/$PARTIDO.md"
              echo "$PARTIDO" >> procesados.txt
            else
              printf '## %s\n\n⚠️ No se pudo procesar %s. Revisar el registro del workflow.\n' "$PARTIDO" "$URL_PDF" > "informes/$PARTIDO-error.md"
            fi
          done < encontrados.txt

      - name: Abrir o ampliar la propuesta de cambio para revisar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s procesados.txt ]; then echo "Nada nuevo que proponer."; exit 0; fi
          LISTA=$(paste -sd ' ' procesados.txt)
          git config user.name "info29n-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$RAMA" ]; then
            RAMA="programas-$(echo $LISTA | tr ' ' '-')-$(date +%Y%m%d-%H%M)"
            git checkout -b "$RAMA"
          fi
          git add datos.json
          git commit -m "Programas de $LISTA: borrador para revisar [skip netlify]"
          git push origin "$RAMA"
          # Un informe por comentario: la descripción de GitHub admite como mucho 65.536 caracteres.
          set -- informes/*.md
          if [ -z "$PR" ]; then
            URL=$(gh pr create --base main --head "$RAMA" \
                    --title "Programas electorales: $LISTA (revisar antes de publicar)" --body-file "$1")
            PR=${URL##*/}; shift
          else
            TITULO=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq .title | sed 's/ (revisar antes de publicar)$//')
            gh api -X PATCH "repos/${{ github.repository }}/pulls/$PR" -f title="$TITULO $LISTA (revisar antes de publicar)" > /dev/null
          fi
          for f in "$@"; do gh pr comment "$PR" --body-file "$f"; done
