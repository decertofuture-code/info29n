name: Actualizar datos

on:
  schedule:
    - cron: "0 5 * * *"            # 07:00 en España hasta el 25 de octubre y 06:00 después (cambio de hora): actualiza y manda el informe
    - cron: "0 9,13,17,21 * * *"   # resto del día: solo actualiza noticias
  push:
    paths:
      - datos.json                 # si editas datos.json a mano, solo se refresca la caché
  workflow_dispatch:
    inputs:
      informe:
        description: "¿Crear también el informe diario?"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recoger noticias y avisos
        run: python actualizar.py

      - name: Publicar en X (calendario, cuenta atrás y resumen de ayer)
        if: github.event.schedule == '0 5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.informe)
        continue-on-error: true   # si X falla, las noticias se guardan igual
        run: python publicar_x.py diario
        env:
          X_ACTIVO: ${{ vars.X_ACTIVO }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: Guardar cambios (sin publicar en Netlify; la web lee los datos de GitHub)
        run: |
          git config user.name "info29n-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC [skip netlify]"
            git push
            curl -fsS https://purge.jsdelivr.net/gh/${{ github.repository }}@main/datos.json || true
          fi

      - name: Informe diario
        if: (github.event.schedule == '0 5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.informe)) && hashFiles('informe.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Revisión del $(TZ=Europe/Madrid date +'%d/%m/%Y')" \
            --body-file informe.md

  al-editar-datos:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Refrescar la caché de datos.json
        run: curl -fsS https://purge.jsdelivr.net/gh/${{ github.repository }}@main/datos.json || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Anunciar en X los cambios de esta edición
        run: python publicar_x.py cambios
        env:
          X_ACTIVO: ${{ vars.X_ACTIVO }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
