name: Publicar anuncios en X

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  anunciar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar los anuncios pendientes
        env:
          X_ACTIVO: ${{ vars.X_ACTIVO }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python anuncios.py
      - name: Guardar qué se ha publicado
        run: |
          git config user.name "info29n-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          if git diff --cached --quiet; then echo "Sin cambios."; else
            git commit -m "Anuncios publicados en X [skip netlify]"; git pull --rebase; git push; fi
