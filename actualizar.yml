name: Actualizar datos

on:
  schedule:
    - cron: "0 5 * * *"            # 07:00 en España hasta el 25 de octubre y 06:00 después (cambio de hora): actualiza y manda el informe
    - cron: "0 9,13,17,21 * * *"   # resto del día: solo actualiza noticias
  workflow_dispatch:
    inputs:
      informe:
        description: "¿Crear también el informe diario?"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recoger noticias y avisos
        run: python scripts/actualizar.py

      - name: Guardar cambios (Netlify publica solo)
        run: |
          git config user.name "info29n-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/datos.json scripts/estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Informe diario
        if: (github.event.schedule == '0 5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.informe)) && hashFiles('informe.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Revisión del $(TZ=Europe/Madrid date +'%d/%m/%Y')" \
            --body-file informe.md
